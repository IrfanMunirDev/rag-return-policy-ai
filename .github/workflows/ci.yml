name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: [self-hosted, windows, x64, ollama]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show .NET version
        run: dotnet --version

      - name: Restore
        run: dotnet restore RAGReturnPolicy.sln

      - name: Build
        run: dotnet build RAGReturnPolicy.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test RAGReturnPolicy.sln --no-build --configuration Release