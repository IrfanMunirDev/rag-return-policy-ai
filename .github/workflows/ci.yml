name: CI/CD Local Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-and-deploy:
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show .NET version
        run: dotnet --version

      - name: Restore Solution
        run: dotnet restore RAGReturnPolicy.sln

      - name: Build Solution
        run: dotnet build RAGReturnPolicy.sln --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test RAGReturnPolicy.sln --no-build --configuration Release

      - name: Build Docker Image
        run: docker build -t stage-dev-rag-retun-policy:latest .

      - name: Stop Old Container
        run: |
          docker stop stage-dev-rag-retun-policy || true
          docker rm stage-dev-rag-retun-policy || true

      - name: Run New Local Container
        env:
          # Optional secrets if you use them, or placeholders
          MY_SECURE_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OLLAMA_HOST_ENDPOINT: "http://host.docker.internal:11434/v1/"
        run: |
          docker run -d `
            --name stage-dev-rag-retun-policy `
            -p 8080:8080 `
            -e Ollama__Endpoint="$env:OLLAMA_HOST_ENDPOINT" `
            -e OpenAI__ApiKey="$env:MY_SECURE_API_KEY" `
            stage-dev-rag-retun-policy:latest